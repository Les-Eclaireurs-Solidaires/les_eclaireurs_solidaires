@if (userState.isLoading()) {
  <div class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Chargement du profil...</p>
  </div>
} 
@else {
  <mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image">
      <img [src]="userState.myAvatar() || '/avatar/default.png'" alt="avatar" width="40" style="border-radius: 50%;">
    </div>
    
    <mat-card-title>
      
    </mat-card-title>
    
    <mat-card-subtitle>{{ userState.currentUser()?.getEmail() }}</mat-card-subtitle>
  </mat-card-header>
  
  
  <mat-card-content>
    <p>Rôle : {{ userState.myRole() }}</p>
  </mat-card-content>
</mat-card>
}
