<mat-card class="card-register">
  <mat-card-header class="card-register-header">
    <mat-card-title>Créer un compte bénévole</mat-card-title>
    <mat-card-subtitle>Tous les champs sont obligatoires</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="card-register-content">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-inputs">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Prénom</mat-label>
          <input matInput formControlName="firstName" type="text" required />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="lastName" type="text" required />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" type="email" required />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password" type="password" required />
        </mat-form-field>
      </div>

      <mat-card-actions class="card-register-actions">
        <button mat-raised-button color="primary" type="submit">M'inscrire</button>
      </mat-card-actions>
    </form>
  </mat-card-content>

  <mat-divider></mat-divider>

  <mat-card-footer class="card-register-footer">
    <mat-card-title>Vous avez déjà un compte ?</mat-card-title>
    <mat-card-actions class="card-register-footer-actions">
      <button mat-button color="primary" routerLink="/login">Se connecter</button>
    </mat-card-actions>
  </mat-card-footer>
</mat-card>
