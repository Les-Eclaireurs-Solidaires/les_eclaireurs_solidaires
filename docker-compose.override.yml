services:
  backend:
    build:
      context: ./backend
      target: development
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:4200"
    environment:
      - NODE_ENV=development
      - NG_ALLOWED_HOSTS=localhost,127.0.0.1,127.0.0.1:4200,localhost:4200,172.18.0.5,frontend
